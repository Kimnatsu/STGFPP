<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고객센터 — FPP v2</title>
<meta name="description" content="FPP v2 고객센터 — FAQ 검색, 1:1 문의" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
(function(){try{var t=localStorage.getItem('fpp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/CustomerService.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body data-page="cs">

<div class="ambient" aria-hidden="true"></div>

<header id="appHeader" class="app-header"></header>
<nav id="desktopNav" class="desk-nav" aria-label="주 메뉴"></nav>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="navDrawer" aria-label="전체 메뉴" aria-hidden="true"></aside>

<main id="view">
  <div class="banner banner--page" aria-label="고객센터 배너">
    <div class="banner-fallback" aria-hidden="true"></div>
    <div class="banner-media" id="csBannerMedia"></div>
  </div>

  <div class="wrap cs-wrap">
    <!-- 검색 영역 (배너 바로 아래) -->
    <div class="cs-search rv" role="search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg>
      <input id="csSearch" type="search" placeholder="궁금한 점을 검색하세요. (제목·내용·작성자)" aria-label="고객센터 검색" />
    </div>

    <!-- 목록 화면 -->
    <div id="csListSection">
      <div class="cs-actions rv">
        <button class="btn btn--gold" id="csAsk" type="button">1:1 문의</button>
        <button class="btn btn--ghost" id="csMyBtn" type="button">나의 문의 보기</button>
      </div>
      <div class="cs-list rv" id="csGrid" aria-label="고객센터 목록"></div>
    </div>

    <!-- 상세 화면 (배너 아래 영역만 교체) -->
    <div id="csDetail" hidden>
      <button class="detail-back" id="goCsList" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5l-7 7 7 7"/></svg>
        고객센터 목록
      </button>
      <article class="detail">
        <div class="detail-head">
          <h2 class="detail-title" id="csTitle"></h2>
          <div class="detail-meta" id="csMeta"></div>
        </div>
        <div class="detail-body" id="csContent"></div>
      </article>
      <div class="box detail-list-box">
        <div class="box-head"><h2 class="box-title">고객센터</h2></div>
        <div class="box-body" id="csList"></div>
      </div>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap foot-in">
    <span class="foot-logo">FPP</span>
    <p>FPP v2 — 팬 커뮤니티 · 본 사이트는 비공식 팬 프로젝트입니다.</p>
    <p class="foot-sub">데이터는 기존 Firebase 프로젝트(fighting-path-patch)에서 실시간으로 불러옵니다.</p>
  </div>
</footer>

<nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/Firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/CustomerService.js"></script>
</body>
</html>
